on:
  workflow_dispatch:
  push:
    branches: main

name: Render and publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        # knitr/rmarkdown are required by Quarto to run R code chunks.
        # Add any additional R packages your analysis needs to this list.
        run: install.packages(c("knitr", "rmarkdown", "readr", "dplyr", "ggplot2"))
        shell: Rscript {0}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
